interface:
  display_name: Prototype to Production
  short_description: Redesign faithfully and resume saved progress
  default_prompt: Use $prototype-to-production. If this project has an unfinished
    redesign, resume its exact saved phase and task. Otherwise discover the existing
    app, prototype the requested design, verify coverage and visuals, then wait for
    my approval.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true

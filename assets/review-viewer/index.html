<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blueprint review</title>
  <link rel="stylesheet" href="/viewer.css">
  <script defer src="/markdown.js"></script>
  <script defer src="/sanitize.js"></script>
  <script defer src="/comparisons.js"></script>
  <script defer src="/viewer.js"></script>
</head>
<body>
  <header>
    <strong>Blueprint review</strong>
    <span id="revision"></span>
    <div class="review-header-actions">
      <button id="completion-toggle" type="button" aria-controls="completion-review" aria-expanded="false" hidden>Application Completion Review</button>
      <button id="register-toggle" type="button" aria-expanded="false">Visual Review Register</button>
    </div>
  </header>
  <div id="layout">
    <nav aria-label="Review sections"></nav>
    <main>
      <p id="error" role="alert"></p>
      <section id="completion-review" aria-labelledby="completion-title" hidden>
        <h1 id="completion-title" tabindex="-1">Application Completion Review</h1>
        <div id="completion-results"></div>
        <button id="completion-refresh" type="button">Refresh completion review</button>
      </section>
      <section id="visual-register" aria-labelledby="register-title" hidden>
        <h1 id="register-title">Visual Review Register</h1>
        <p id="register-counts" aria-live="polite"></p>
        <section id="visual-quality-report" aria-labelledby="quality-title" hidden>
          <h2 id="quality-title">Application Visual Quality Report</h2>
          <div id="quality-results"></div>
        </section>
        <div id="register-project-status"></div>
        <p class="register-note">Technical verification and your final acceptance are recorded separately. Findings remain available for review.</p>
        <div id="register-filters">
          <label>Slice <select id="register-slice"><option value="">All slices</option></select></label>
          <label>Status <select id="register-status">
            <option value="">All findings and clean evidence</option><option value="open">Unresolved</option>
            <option value="corrected">Verified fixed</option>
            <option value="improved">Improved — not verified</option><option value="noted">For review</option><option value="warnings">Documented warnings</option><option value="clean">Clean evidence</option>
            <option value="baselines">Original UI baselines</option>
          </select></label>
          <label>Find <input id="register-search" type="search" autocomplete="off" placeholder="Route, finding, attempt"></label>
          <button id="register-refresh" type="button">Refresh register</button>
        </div>
        <div id="register-entries" aria-live="polite"></div>
      </section>
      <h1 id="title">Review sections</h1>
      <div id="impact"></div>
      <p id="why"></p>
      <div id="tools">
        <label>Compare with
          <select id="baseline">
            <option value="previous">Previous revision</option>
            <option value="approved">Last approved revision</option>
          </select>
        </label>
        <label>Context
          <select id="context">
            <option>Component</option>
            <option>Feature</option>
            <option>Slice</option>
            <option>Blueprint</option>
            <option>Application</option>
          </select>
        </label>
      </div>
      <div id="cards"></div>
    </main>
  </div>
</body>
</html>
